<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favIcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>LearnForge</title>
    <meta
      name="description"
      content="Join 120,000+ learners on LearnForge. Explore 2,400+ expert-led courses in development, design, data science, and more. Learn at your pace, earn certificates, and land the roles you want."
    />
    <meta
      name="keywords"
      content="online courses, certifications, web development, data science, design, LearnForge, e-learning, programming, career skills"
    />
    <meta name="author" content="LearnForge Inc." />
    <meta name="theme-color" content="#6d28d9" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learnforge.io/" />
    <meta
      property="og:title"
      content="LearnForge — Expert-Led Online Courses & Certifications"
    />
    <meta
      property="og:description"
      content="2,400+ expert-led courses in development, design, data, and more. Learn at your pace, earn certificates, and advance your career."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="LearnForge" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@learnforge" />
    <meta
      name="twitter:title"
      content="LearnForge — Expert-Led Online Courses & Certifications"
    />
    <meta
      name="twitter:description"
      content="2,400+ expert-led courses in development, design, data, and more. Join 120,000+ learners already upskilling on LearnForge."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://learnforge.io/" />

    <!-- Structured data — Organisation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LearnForge",
        "url": "https://learnforge.io",
        "logo": "https://learnforge.io/favIcon.svg",
        "description": "Expert-led online learning for ambitious professionals.",
        "sameAs": [
          "https://twitter.com/learnforge",
          "https://linkedin.com/company/learnforge",
          "https://youtube.com/@learnforge"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "url": "https://learnforge.io/contact"
        }
      }
    </script>

    <!-- Structured data — EducationalOrganization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "LearnForge",
        "url": "https://learnforge.io",
        "description": "LearnForge offers 2,400+ expert-led courses across development, design, data science, and more. 120,000+ learners enrolled worldwide.",
        "numberOfEmployees": {
          "@type": "QuantitativeValue",
          "value": 180,
          "unitText": "instructors worldwide"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Online Courses",
          "numberOfItems": 2400
        }
      }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
  </body>
</html>
